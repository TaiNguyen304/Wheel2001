<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Điểm - Scoreboard</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      font-weight: bold !important;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    #scoreboardContainer {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* SECTION TRÊN: CAMERA CUTOUTS & PHÔNG ĐÊM */
    #topSection {
      height: 58%;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 2%;
      overflow: hidden;
    }

    /* Background SVG với Mask đục lỗ 3 ô Camera */
    .top-bg-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 3 Ô LỖ KHUNG CAMERA */
    .cam-box {
      width: 29%;
      height: 76%;
      position: relative;
      z-index: 2;
      background: transparent;
      border: 4px solid #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* THANH BẠC PHÂN CÁCH GIỮA */
    #dividerBar {
      height: 20px;
      width: 100%;
      background: linear-gradient(180deg, #ffffff 0%, #d0d0d0 25%, #999999 50%, #666666 75%, #333333 100%);
      border-top: 2px solid #ffffff;
      border-bottom: 2px solid #1a1a1a;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 10;
    }

    /* SECTION DƯỚI: BẢNG ĐIỂM 3 NGƯỜI CHƠI */
    #bottomSection {
      height: calc(42% - 20px);
      width: 100%;
      display: flex;
      position: relative;
      z-index: 5;
    }

    .player-column {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 15px;
      overflow: hidden;
    }

    /* Hình chìm CHIẾC NÓN KỲ DIỆU */
    .watermark-text {
      position: absolute;
      font-size: 2.8vw;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      opacity: 0.22;
      width: 90%;
      line-height: 1.2;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Column 1: RED */
    .col-p1 {
      background: linear-gradient(180deg, #dc143c 0%, #a00000 50%, #660000 100%);
      border-right: 2px solid rgba(0, 0, 0, 0.3);
    }
    .col-p1 .watermark-text { color: #ffe6e6; }

    /* Column 2: GOLD / YELLOW */
    .col-p2 {
      background: linear-gradient(180deg, #d4af37 0%, #aa8800 50%, #775500 100%);
      border-right: 2px solid rgba(0, 0, 0, 0.3);
    }
    .col-p2 .watermark-text { color: #fffde6; }

    /* Column 3: BLUE */
    .col-p3 {
      background: linear-gradient(180deg, #0088cc 0%, #0055a0 50%, #003366 100%);
    }
    .col-p3 .watermark-text { color: #e6f2ff; }

    /* THẺ HIỂN THỊ ĐIỂM SỐ */
    .score-card {
      position: relative;
      z-index: 3;
      background: rgba(0, 0, 0, 0.45);
      border: 3px solid #ffffff;
      border-radius: 16px;
      padding: 15px 25px;
      width: 85%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(4px);
    }

    .player-label {
      font-size: 1.4vw;
      color: #ffeb3b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .mode-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.95vw;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      background: #800080;
      color: #ffffff;
      border: 1px solid #ff00ff;
      box-shadow: 0 0 8px rgba(255, 0, 255, 0.5);
    }

    .score-value {
      font-size: 3.8vw;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 4px 8px rgba(0, 0, 0, 0.9);
      letter-spacing: 2px;
      line-height: 1.1;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .score-pulse {
      animation: scorePulseAnim 0.35s ease-out;
    }

    @keyframes scorePulseAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); color: #ffff00; }
      100% { transform: scale(1); }
    }

    /* MODAL NHẬP MÃ PHÒNG KHI CẦN */
    .room-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .room-modal-box {
      background: #1e1e24;
      border: 3px solid #800080;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      width: 380px;
      box-shadow: 0 0 25px rgba(128, 0, 128, 0.5);
    }

    .room-modal-box h2 {
      color: #ffff00;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .room-modal-box input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      border-radius: 8px;
      border: 2px solid #555;
      background: #333;
      color: #fff;
      margin-bottom: 20px;
      outline: none;
    }

    .room-modal-box button {
      background: #800080;
      color: #fff;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .room-modal-box button:hover {
      background: orange;
      color: white;
    }

    /* NÚT ĐỔI PHÒNG NHỎ Ở GÓC */
    #roomChangeBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.2s;
    }

    #roomChangeBtn:hover {
      opacity: 1;
      background: #800080;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.4/dist/socket.io.min.js"></script>
</head>

<body>

  <button id="roomChangeBtn" onclick="openRoomModal()">Đổi mã phòng</button>

  <div id="scoreboardContainer">
    <!-- SECTION TRÊN: CAMERA CUTOUTS -->
    <div id="topSection">
      <!-- Background SVG mask đục lỗ 3 camera -->
      <svg class="top-bg-svg" preserveAspectRatio="none">
        <defs>
          <!-- Gradient Bầu trời đêm -->
          <radialGradient id="skyGradient" cx="50%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#0e1a4d" />
            <stop offset="60%" stop-color="#050a26" />
            <stop offset="100%" stop-color="#010310" />
          </radialGradient>

          <!-- Pattern Ngôi sao nhỏ -->
          <pattern id="starsPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
            <circle cx="15" cy="20" r="1.2" fill="#ffffff" opacity="0.8" />
            <circle cx="75" cy="40" r="1.5" fill="#ffffff" opacity="0.9" />
            <circle cx="40" cy="70" r="1" fill="#ffffff" opacity="0.6" />
            <circle cx="85" cy="15" r="1" fill="#88ccff" opacity="0.7" />
            <circle cx="25" cy="80" r="1.8" fill="#ffffff" opacity="0.9" />
            <circle cx="60" cy="10" r="1.2" fill="#ffffff" opacity="0.7" />
          </pattern>

          <!-- MASK ĐỤC LỖ 3 KHUNG CAMERA (TRẮNG LÀ HỆN BG, ĐEN LÀ ĐỤC TRONG SUỐT) -->
          <mask id="cameraHolesMask">
            <rect width="100%" height="100%" fill="white" />
            <rect id="hole1" x="0" y="0" width="0" height="0" rx="12" fill="black" />
            <rect id="hole2" x="0" y="0" width="0" height="0" rx="12" fill="black" />
            <rect id="hole3" x="0" y="0" width="0" height="0" rx="12" fill="black" />
          </mask>
        </defs>

        <!-- Lớp phông trời đêm có mask đục lỗ -->
        <rect width="100%" height="100%" fill="url(#skyGradient)" mask="url(#cameraHolesMask)" />
        <rect width="100%" height="100%" fill="url(#starsPattern)" mask="url(#cameraHolesMask)" opacity="0.8" />

        <!-- Bóng dải thành phố phía dưới phông đêm -->
        <path d="M 0 100% L 0 92% L 3% 92% L 3% 88% L 7% 88% L 7% 95% L 12% 95% L 12% 85% L 16% 85% L 16% 95% L 22% 95% L 22% 89% L 28% 89% L 28% 96% L 35% 96% L 35% 86% L 40% 86% L 40% 95% L 48% 95% L 48% 84% L 54% 84% L 54% 96% L 62% 96% L 62% 88% L 68% 88% L 68% 95% L 75% 95% L 75% 85% L 82% 85% L 82% 96% L 90% 96% L 90% 89% L 96% 89% L 96% 96% L 100% 96% L 100% 100% Z" fill="#020512" mask="url(#cameraHolesMask)" opacity="0.85" />
      </svg>

      <!-- 3 Khung viền camera trong suốt -->
      <div id="camBox1" class="cam-box"></div>
      <div id="camBox2" class="cam-box"></div>
      <div id="camBox3" class="cam-box"></div>
    </div>

    <!-- THANH BẠC PHÂN CÁCH -->
    <div id="dividerBar"></div>

    <!-- SECTION DƯỚI: BẢNG ĐIỂM 3 NGƯỜI CHƠI -->
    <div id="bottomSection">
      <!-- Player 1 -->
      <div class="player-column col-p1">
        <div class="watermark-text">CHIẾC NÓN KỲ DIỆU</div>
        <div class="score-card">
          <div class="player-label">PLAYER 1</div>
          <div id="modeBadge1" class="mode-badge">ĐIỂM VÒNG</div>
          <div id="scoreVal1" class="score-value">0</div>
        </div>
      </div>

      <!-- Player 2 -->
      <div class="player-column col-p2">
        <div class="watermark-text">CHIẾC NÓN KỲ DIỆU</div>
        <div class="score-card">
          <div class="player-label" style="color: #000000; text-shadow: none;">PLAYER 2</div>
          <div id="modeBadge2" class="mode-badge">ĐIỂM VÒNG</div>
          <div id="scoreVal2" class="score-value">0</div>
        </div>
      </div>

      <!-- Player 3 -->
      <div class="player-column col-p3">
        <div class="watermark-text">CHIẾC NÓN KỲ DIỆU</div>
        <div class="score-card">
          <div class="player-label">PLAYER 3</div>
          <div id="modeBadge3" class="mode-badge">ĐIỂM VÒNG</div>
          <div id="scoreVal3" class="score-value">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL ĐĂNG NHẬP PHÒNG -->
  <div id="roomModal" class="room-modal-overlay" style="display: none;">
    <div class="room-modal-box">
      <h2>KẾT NỐI BẢNG ĐIỂM</h2>
      <p style="color: #bbb; margin-bottom: 15px; font-size: 14px;">Nhập mã phòng 6 chữ số từ Controller</p>
      <input type="text" id="modalRoomIdInput" maxlength="6" placeholder="Nhập mã phòng..." />
      <button onclick="confirmConnectRoom()">KẾT NỐI BẢNG ĐIỂM</button>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });

    let currentRoomId = null;
    let scoresState = {
      p1: { round: 0, total: 0 },
      p2: { round: 0, total: 0 },
      p3: { round: 0, total: 0 },
      displayMode: 'round'
    };

    // Hàm cập nhật đục lỗ mask SVG theo vị trí 3 khung camera
    function updateCameraCutouts() {
      const topBg = document.getElementById('topSection').getBoundingClientRect();
      const b1 = document.getElementById('camBox1').getBoundingClientRect();
      const b2 = document.getElementById('camBox2').getBoundingClientRect();
      const b3 = document.getElementById('camBox3').getBoundingClientRect();

      const h1 = document.getElementById('hole1');
      const h2 = document.getElementById('hole2');
      const h3 = document.getElementById('hole3');

      if (h1 && b1) {
        h1.setAttribute('x', b1.left - topBg.left);
        h1.setAttribute('y', b1.top - topBg.top);
        h1.setAttribute('width', b1.width);
        h1.setAttribute('height', b1.height);
      }
      if (h2 && b2) {
        h2.setAttribute('x', b2.left - topBg.left);
        h2.setAttribute('y', b2.top - topBg.top);
        h2.setAttribute('width', b2.width);
        h2.setAttribute('height', b2.height);
      }
      if (h3 && b3) {
        h3.setAttribute('x', b3.left - topBg.left);
        h3.setAttribute('y', b3.top - topBg.top);
        h3.setAttribute('width', b3.width);
        h3.setAttribute('height', b3.height);
      }
    }

    window.addEventListener('resize', updateCameraCutouts);
    window.addEventListener('load', () => {
      setTimeout(updateCameraCutouts, 100);
      initRoomConnection();
    });

    function formatThousands(num) {
      if (num === null || num === undefined || isNaN(num)) return '0';
      let str = Math.round(Number(num)).toString();
      let isNeg = str.startsWith('-');
      if (isNeg) str = str.substring(1);
      let formatted = str.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return isNeg ? '-' + formatted : formatted;
    }

    function renderScores() {
      const isTotal = scoresState.displayMode === 'total';
      const badgeText = isTotal ? 'ĐIỂM TỔNG' : 'ĐIỂM VÒNG';

      document.getElementById('modeBadge1').innerText = badgeText;
      document.getElementById('modeBadge2').innerText = badgeText;
      document.getElementById('modeBadge3').innerText = badgeText;

      const val1 = isTotal ? scoresState.p1.total : scoresState.p1.round;
      const val2 = isTotal ? scoresState.p2.total : scoresState.p2.round;
      const val3 = isTotal ? scoresState.p3.total : scoresState.p3.round;

      updateScoreDisplay('scoreVal1', val1);
      updateScoreDisplay('scoreVal2', val2);
      updateScoreDisplay('scoreVal3', val3);
    }

    function updateScoreDisplay(elementId, newScore) {
      const el = document.getElementById(elementId);
      if (!el) return;

      const formatted = formatThousands(newScore);
      if (el.innerText !== formatted) {
        el.innerText = formatted;
        el.classList.remove('score-pulse');
        void el.offsetWidth; // Trigger reflow
        el.classList.add('score-pulse');
      }
    }

    function initRoomConnection() {
      const urlParams = new URLSearchParams(window.location.search);
      let roomParam = urlParams.get('roomid') || sessionStorage.getItem('scoreboard_roomid');

      if (roomParam) {
        connectToRoom(roomParam);
      } else {
        openRoomModal();
      }
    }

    function openRoomModal() {
      document.getElementById('roomModal').style.display = 'flex';
      document.getElementById('modalRoomIdInput').focus();
    }

    function confirmConnectRoom() {
      const inputVal = document.getElementById('modalRoomIdInput').value.trim();
      if (!inputVal) return;
      document.getElementById('roomModal').style.display = 'none';
      connectToRoom(inputVal);
    }

    function connectToRoom(roomid) {
      currentRoomId = roomid;
      sessionStorage.setItem('scoreboard_roomid', roomid);

      // Cập nhật URL parameter mà không reload trang
      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?roomid=' + roomid;
      window.history.pushState({ path: newUrl }, '', newUrl);

      if (socket.connected) {
        joinRoomSocket();
      }
    }

    function joinRoomSocket() {
      if (!currentRoomId) return;
      socket.emit('playerVerifyLogin', { roomid: currentRoomId, playerRole: 'viewer' });
    }

    socket.on('connect', () => {
      if (currentRoomId) {
        joinRoomSocket();
      }
    });

    socket.on('initGameState', (state) => {
      if (state && state.scores) {
        scoresState = state.scores;
        renderScores();
      }
    });

    socket.on('syncScores', (scoresData) => {
      if (scoresData) {
        if (scoresData.p1) scoresState.p1 = scoresData.p1;
        if (scoresData.p2) scoresState.p2 = scoresData.p2;
        if (scoresData.p3) scoresState.p3 = scoresData.p3;
        if (scoresData.displayMode) scoresState.displayMode = scoresData.displayMode;
        renderScores();
      }
    });
  </script>
</body>

</html>
