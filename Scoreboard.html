<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Điểm - Scoreboard</title>
  <style>
    @font-face {
      font-family: 'FortuneWheel';
      src: url('NVA-SF Fortune Wheel.ttf') format('truetype');
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      font-weight: bold !important;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scoreboardContainer {
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (2005 / 1125));
      max-height: calc(100vw * (1125 / 2005));
      aspect-ratio: 2005 / 1125;
      display: flex;
      flex-direction: column;
      position: relative;
      background: transparent !important;
      container-type: size;
    }

    /* ĐẠT ĐỤC LỖ CAMERA BẰNG MASK TRÊN LỚP NỀN BG.PNG */
    #scoreboardContainer::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background: url('bg.png') no-repeat center center;
      background-size: 100% 100%;

      /* Đục 3 lỗ tương ứng 3 khung đen trên ảnh bg.png */
      -webkit-mask-image: 
        linear-gradient(#000 0 0),
        linear-gradient(#000 0 0),
        linear-gradient(#000 0 0),
        linear-gradient(#000 0 0);
      mask-image: 
        linear-gradient(#000 0 0),
        linear-gradient(#000 0 0),
        linear-gradient(#000 0 0),
        linear-gradient(#000 0 0);

      -webkit-mask-composite: xor;
      mask-composite: exclude;

      /* Kích thước chính xác 3 ô cambox theo tỷ lệ 16:9 */
      -webkit-mask-size: 
        100% 100%,
        31.8% 56.6%,
        31.8% 56.6%,
        31.8% 56.6%;
      mask-size: 
        100% 100%,
        31.8% 56.6%,
        31.8% 56.6%,
        31.8% 56.6%;

      /* Căn tọa độ chính xác cho 3 lỗ đục */
      -webkit-mask-position: 
        0 0,
        1.2% 8.5%,
        50% 8.5%,
        98.8% 8.5%;
      mask-position: 
        0 0,
        1.2% 8.5%,
        50% 8.5%,
        98.8% 8.5%;

      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* SECTION TRÊN: KHUNG CAMERA TRONG SUỐT */
    #topSection {
      height: 66.7%;
      width: 100%;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.2%;
      overflow: hidden;
      background: transparent;
    }

    .cam-box {
      aspect-ratio: 16 / 9;
      width: 31.8%;
      max-height: 90%;
      position: relative;
      z-index: 2;
      background: transparent !important;
      border: none;
      box-shadow: none;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SECTION DƯỚI: ĐIỂM SỐ 3 NGƯỜI CHƠI */
    #bottomSection {
      height: 33.3%;
      width: 100%;
      display: flex;
      position: relative;
      z-index: 5;
    }

    .player-column {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: transparent !important;
      border: none !important;
    }

    .score-card {
      position: relative;
      z-index: 5;
      background: transparent;
      border: none;
      width: 100%;
      text-align: center;
    }

    .score-value {
      position: relative;
      z-index: 5;
      font-size: 6cqw;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 0 4px 10px rgba(0, 0, 0, 0.9);
      letter-spacing: 2px;
      line-height: 1;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .score-pulse {
      animation: scorePulseAnim 0.35s ease-out;
    }

    @keyframes scorePulseAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); color: #ffff00; }
      100% { transform: scale(1); }
    }

    /* MODAL NHẬP MÃ PHÒNG KHI CẦN */
    .room-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .room-modal-box {
      background: #1e1e24;
      border: 3px solid #800080;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      width: 380px;
      box-shadow: 0 0 25px rgba(128, 0, 128, 0.5);
    }

    .room-modal-box h2 {
      color: #ffff00;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .room-modal-box input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      border-radius: 8px;
      border: 2px solid #555;
      background: #333;
      color: #fff;
      margin-bottom: 20px;
      outline: none;
    }

    .room-modal-box button {
      background: #800080;
      color: #fff;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .room-modal-box button:hover {
      background: orange;
      color: white;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.4/dist/socket.io.min.js"></script>
</head>

<body>

  <div id="scoreboardContainer">
    <!-- SECTION TRÊN: CAMERA CUTOUTS -->
    <div id="topSection">
      <div id="camBox1" class="cam-box"></div>
      <div id="camBox2" class="cam-box"></div>
      <div id="camBox3" class="cam-box"></div>
    </div>

    <!-- SECTION DƯỚI: BẢNG ĐIỂM 3 NGƯỜI CHƠI -->
    <div id="bottomSection">
      <!-- Player 1 -->
      <div class="player-column col-p1">
        <div class="score-card">
          <div id="scoreVal1" class="score-value">0</div>
        </div>
      </div>

      <!-- Player 2 -->
      <div class="player-column col-p2">
        <div class="score-card">
          <div id="scoreVal2" class="score-value">0</div>
        </div>
      </div>

      <!-- Player 3 -->
      <div class="player-column col-p3">
        <div class="score-card">
          <div id="scoreVal3" class="score-value">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL ĐĂNG NHẬP PHÒNG -->
  <div id="roomModal" class="room-modal-overlay" style="display: none;">
    <div class="room-modal-box">
      <h2>KẾT NỐI BẢNG ĐIỂM</h2>
      <p style="color: #bbb; margin-bottom: 15px; font-size: 14px;">Nhập mã phòng 6 chữ số từ Controller</p>
      <input type="text" id="modalRoomIdInput" maxlength="6" placeholder="Nhập mã phòng..." />
      <button onclick="confirmConnectRoom()">KẾT NỐI BẢNG ĐIỂM</button>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });

    let currentRoomId = null;
    let scoresState = {
      p1: { round: 0, total: 0 },
      p2: { round: 0, total: 0 },
      p3: { round: 0, total: 0 },
      displayMode: 'round'
    };

    window.addEventListener('load', () => {
      initRoomConnection();
    });

    function formatThousands(num) {
      if (num === null || num === undefined || isNaN(num)) return '0';
      let str = Math.round(Number(num)).toString();
      let isNeg = str.startsWith('-');
      if (isNeg) str = str.substring(1);
      let formatted = str.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return isNeg ? '-' + formatted : formatted;
    }

    function renderScores() {
      const isTotal = scoresState.displayMode === 'total';

      const val1 = isTotal ? scoresState.p1.total : scoresState.p1.round;
      const val2 = isTotal ? scoresState.p2.total : scoresState.p2.round;
      const val3 = isTotal ? scoresState.p3.total : scoresState.p3.round;

      updateScoreDisplay('scoreVal1', val1);
      updateScoreDisplay('scoreVal2', val2);
      updateScoreDisplay('scoreVal3', val3);
    }

    function updateScoreDisplay(elementId, newScore) {
      const el = document.getElementById(elementId);
      if (!el) return;

      const formatted = formatThousands(newScore);
      if (el.innerText !== formatted) {
        el.innerText = formatted;
        el.classList.remove('score-pulse');
        void el.offsetWidth; // Trigger reflow
        el.classList.add('score-pulse');
      }
    }

    function initRoomConnection() {
      const urlParams = new URLSearchParams(window.location.search);
      let roomParam = urlParams.get('roomid') || sessionStorage.getItem('scoreboard_roomid');

      if (roomParam) {
        connectToRoom(roomParam);
      } else {
        openRoomModal();
      }
    }

    function openRoomModal() {
      document.getElementById('roomModal').style.display = 'flex';
      document.getElementById('modalRoomIdInput').focus();
    }

    function confirmConnectRoom() {
      const inputVal = document.getElementById('modalRoomIdInput').value.trim();
      if (!inputVal) return;
      document.getElementById('roomModal').style.display = 'none';
      connectToRoom(inputVal);
    }

    function connectToRoom(roomid) {
      currentRoomId = roomid;
      sessionStorage.setItem('scoreboard_roomid', roomid);

      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?roomid=' + roomid;
      window.history.pushState({ path: newUrl }, '', newUrl);

      if (socket.connected) {
        joinRoomSocket();
      }
    }

    function joinRoomSocket() {
      if (!currentRoomId) return;
      socket.emit('playerVerifyLogin', { roomid: currentRoomId, playerRole: 'viewer' });
    }

    socket.on('connect', () => {
      if (currentRoomId) {
        joinRoomSocket();
      }
    });

    socket.on('initGameState', (state) => {
      if (state && state.scores) {
        scoresState = state.scores;
        renderScores();
      }
    });

    socket.on('syncScores', (scoresData) => {
      if (scoresData) {
        if (scoresData.p1) scoresState.p1 = scoresData.p1;
        if (scoresData.p2) scoresState.p2 = scoresData.p2;
        if (scoresData.p3) scoresState.p3 = scoresData.p3;
        if (scoresData.displayMode) scoresState.displayMode = scoresData.displayMode;
        renderScores();
      }
    });
  </script>
</body>

</html>
