<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Điểm - Scoreboard</title>
  <style>
    @font-face {
      font-family: 'FortuneWheel';
      src: url('NVA-SF Fortune Wheel.ttf') format('truetype');
    }

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      font-weight: bold !important;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scoreboardContainer {
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (1024 / 576));
      max-height: calc(100vw * (576 / 1024));
      aspect-ratio: 1024 / 576;
      display: flex;
      flex-direction: column;
      position: relative;
      background: transparent !important;
      container-type: size;
    }

    /* KHUNG SVG CHỨA ẢNH NỀN VÀ ĐỤC LỖ */
    .bg-hole-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* SECTION TRÊN: VÙNG CHỨA CAMERA */
    #topSection {
      height: 66.7%;
      width: 100%;
      position: relative;
      z-index: 2;
      background: transparent;
    }

    /* VỊ TRÍ 3 Ô CAMBOX TRÙNG KHỚP LỖ ĐỤC KÍCH THƯỚC PIXEL */
    .cam-box {
      position: absolute;
      top: 26.39%;
      width: 32.03%;
      height: 31.94%;
      z-index: 2;
      background: transparent !important;
      border: none;
      box-shadow: none;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #camBox1 { left: 0.88%; }
    #camBox2 { left: 33.98%; }
    #camBox3 { left: 67.09%; }

    /* SECTION DƯỚI: ĐIỂM SỐ 3 NGƯỜI CHƠI */
    #bottomSection {
      height: 33.3%;
      width: 100%;
      display: flex;
      position: relative;
      z-index: 5;
    }

    .player-column {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: transparent !important;
      border: none !important;
    }

    .score-card {
      position: relative;
      z-index: 5;
      background: transparent;
      border: none;
      width: 100%;
      text-align: center;
    }

    .score-value {
      position: relative;
      z-index: 5;
      font-size: 6cqw;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 0 4px 10px rgba(0, 0, 0, 0.9);
      letter-spacing: 2px;
      line-height: 1;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .score-pulse {
      animation: scorePulseAnim 0.35s ease-out;
    }

    @keyframes scorePulseAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); color: #ffff00; }
      100% { transform: scale(1); }
    }

    /* MODAL NHẬP MÃ PHÒNG KHI CẦN */
    .room-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .room-modal-box {
      background: #1e1e24;
      border: 3px solid #800080;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      width: 380px;
      box-shadow: 0 0 25px rgba(128, 0, 128, 0.5);
    }

    .room-modal-box h2 {
      color: #ffff00;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .room-modal-box input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      border-radius: 8px;
      border: 2px solid #555;
      background: #333;
      color: #fff;
      margin-bottom: 20px;
      outline: none;
    }

    .room-modal-box button {
      background: #800080;
      color: #fff;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .room-modal-box button:hover {
      background: orange;
      color: white;
    }
  </style>
</head>

<body>

  <div id="scoreboardContainer">
    <!-- SVG ĐỤC LỖ NỀN BG.PNG CHẮC CHẮN NẰM PHÍA DƯỚI CAMBOX VÀ SCORE -->
    <svg class="bg-hole-layer" viewBox="0 0 1024 576" preserveAspectRatio="none">
      <defs>
        <mask id="holeCutout">
          <!-- Phủ trắng toàn bộ khung hình -->
          <rect x="0" y="0" width="1024" height="576" fill="white" />
          <!-- Đục 3 hình chữ nhật màu đen đúng chuẩn vị trí Pixel của ô đen -->
          <rect x="9" y="152" width="328" height="184" fill="black" />
          <rect x="348" y="152" width="328" height="184" fill="black" />
          <rect x="687" y="152" width="328" height="184" fill="black" />
        </mask>
      </defs>
      <!-- Hiển thị ảnh bg.png qua lớp mặt nạ đục lỗ -->
      <image href="bg.png" x="0" y="0" width="1024" height="576" mask="url(#holeCutout)" />
    </svg>

    <!-- SECTION TRÊN: CAMERA CUTOUTS -->
    <div id="topSection">
      <div id="camBox1" class="cam-box"></div>
      <div id="camBox2" class="cam-box"></div>
      <div id="camBox3" class="cam-box"></div>
    </div>

    <!-- SECTION DƯỚI: BẢNG ĐIỂM 3 NGƯỜI CHƠI -->
    <div id="bottomSection">
      <!-- Player 1 -->
      <div class="player-column col-p1">
        <div class="score-card">
          <div id="scoreVal1" class="score-value">0</div>
        </div>
      </div>

      <!-- Player 2 -->
      <div class="player-column col-p2">
        <div class="score-card">
          <div id="scoreVal2" class="score-value">0</div>
        </div>
      </div>

      <!-- Player 3 -->
      <div class="player-column col-p3">
        <div class="score-card">
          <div id="scoreVal3" class="score-value">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- THÔNG BÁO YÊU CẦU MÃ PHÒNG TRÊN URL -->
  <div id="noRoomNoticeModal" class="room-modal-overlay" style="display: none;">
    <div class="room-modal-box" style="border: 3px solid #ff0000; box-shadow: 0 0 25px rgba(255, 0, 0, 0.7); width: 440px;">
      <h2 style="color: #ff3333; margin-bottom: 15px; font-size: 20px; text-transform: uppercase;">THÔNG BÁO HỆ THỐNG</h2>
      <p style="color: #ffffff; margin-bottom: 20px; font-size: 16px; font-weight: bold; line-height: 1.5; text-align: center;">Vui lòng nhập ?roomid=Mã phòng trên URL</p>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="warningRoomInput" maxlength="6" placeholder="Nhập mã phòng (VD: 123456)..." style="margin-bottom: 0;" />
        <button onclick="applyRoomFromInput()" style="width: auto; padding: 12px 18px; white-space: nowrap; background: #39ff14; color: black;">KẾT NỐI</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });

    let currentRoomId = null;
    let scoresState = {
      p1: { round: 0, total: 0 },
      p2: { round: 0, total: 0 },
      p3: { round: 0, total: 0 },
      displayMode: 'round'
    };

    window.addEventListener('load', () => {
      initRoomConnection();
    });

    function formatThousands(num) {
      if (num === null || num === undefined || isNaN(num)) return '0';
      let str = Math.round(Number(num)).toString();
      let isNeg = str.startsWith('-');
      if (isNeg) str = str.substring(1);
      let formatted = str.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return isNeg ? '-' + formatted : formatted;
    }

    function renderScores() {
      const isTotal = scoresState.displayMode === 'total';

      const val1 = isTotal ? scoresState.p1.total : scoresState.p1.round;
      const val2 = isTotal ? scoresState.p2.total : scoresState.p2.round;
      const val3 = isTotal ? scoresState.p3.total : scoresState.p3.round;

      updateScoreDisplay('scoreVal1', val1);
      updateScoreDisplay('scoreVal2', val2);
      updateScoreDisplay('scoreVal3', val3);
    }

    function updateScoreDisplay(elementId, newScore) {
      const el = document.getElementById(elementId);
      if (!el) return;

      const formatted = formatThousands(newScore);
      if (el.innerText !== formatted) {
        el.innerText = formatted;
        el.classList.remove('score-pulse');
        void el.offsetWidth; // Trigger reflow
        el.classList.add('score-pulse');
      }
    }

    function initRoomConnection() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('roomid');

      if (!roomParam || !roomParam.trim()) {
        showNoRoomNotice();
      } else {
        hideNoRoomNotice();
        connectToRoom(roomParam.trim());
      }
    }

    function showNoRoomNotice() {
      document.getElementById('noRoomNoticeModal').style.display = 'flex';
    }

    function hideNoRoomNotice() {
      document.getElementById('noRoomNoticeModal').style.display = 'none';
    }

    function applyRoomFromInput() {
      const inputVal = document.getElementById('warningRoomInput').value.trim();
      if (!inputVal) return;
      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?roomid=' + encodeURIComponent(inputVal);
      window.location.href = newUrl;
    }

    function connectToRoom(roomid) {
      currentRoomId = roomid;
      sessionStorage.setItem('scoreboard_roomid', roomid);

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('roomid') !== roomid) {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?roomid=' + roomid;
        window.history.pushState({ path: newUrl }, '', newUrl);
      }

      if (socket.connected) {
        joinRoomSocket();
      }
    }

    function joinRoomSocket() {
      if (!currentRoomId) return;
      socket.emit('playerVerifyLogin', { roomid: currentRoomId, playerRole: 'viewer' });
      socket.emit('joinRoom', { roomid: currentRoomId, role: 'viewer' });
    }

    socket.on('connect', () => {
      if (currentRoomId) {
        joinRoomSocket();
      }
    });

    socket.on('initGameState', (state) => {
      if (state && state.scores) {
        scoresState = state.scores;
        renderScores();
      }
    });

    socket.on('syncScores', (scoresData) => {
      if (scoresData) {
        if (scoresData.p1) scoresState.p1 = scoresData.p1;
        if (scoresData.p2) scoresState.p2 = scoresData.p2;
        if (scoresData.p3) scoresState.p3 = scoresData.p3;
        if (scoresData.displayMode) scoresState.displayMode = scoresData.displayMode;
        renderScores();
      }
    });
  </script>
</body>

</html>
